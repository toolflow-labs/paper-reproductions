name: Inspect UNSW CANVAS public data

on:
  push:
    branches:
      - data/anu-distributed-pv-1287-2026-09-29
    paths:
      - .github/workflows/inspect-unsw-canvas.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inspection tools
        run: pip install gdown python-docx pandas
      - name: Download official CANVAS sample data folder
        run: |
          mkdir -p /tmp/canvas-data
          gdown --folder 'https://drive.google.com/drive/folders/1pQ3h7HCYYzm1rxQpw1sw4qD8-uZYcZ5R?usp=sharing' -O /tmp/canvas-data
      - name: Show files and basic schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/canvas-data')
          files=[p for p in root.rglob('*') if p.is_file()]
          print('FILE_COUNT', len(files))
          print('TOTAL_BYTES', sum(p.stat().st_size for p in files))
          for p in files:
              print('FILE', p.relative_to(root), p.stat().st_size)
          print('\nSCHEMAS')
          for p in files:
              if p.suffix.lower() == '.csv':
                  try:
                      df=pd.read_csv(p, nrows=3)
                      print('CSV', p.relative_to(root), 'COLUMNS=', list(df.columns), 'SAMPLE_ROWS=', len(df))
                  except Exception as e:
                      print('CSV_ERROR', p.relative_to(root), repr(e))
          PY
      - name: Read upstream dataset documentation
        run: |
          git clone --depth 1 https://github.com/UNSW-CEEM/Solar-Curtailment.git /tmp/solar-curtailment
          python - <<'PY'
          from docx import Document
          p='/tmp/solar-curtailment/documentations/dataset information.docx'
          d=Document(p)
          print('DOC_TEXT_BEGIN')
          for para in d.paragraphs:
              t=para.text.strip()
              if t:
                  print(t)
          for ti, table in enumerate(d.tables):
              print(f'TABLE {ti}')
              for row in table.rows:
                  print(' | '.join(c.text.replace('\n',' / ') for c in row.cells))
          print('DOC_TEXT_END')
          PY
