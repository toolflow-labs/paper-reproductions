name: Inspect UNSW CANVAS docs and data link

on:
  push:
    branches:
      - data/anu-distributed-pv-1287-2026-09-29
    paths:
      - .github/workflows/inspect-unsw-canvas2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install gdown python-docx
      - name: Extract upstream data dictionary
        run: |
          git clone --depth 1 https://github.com/UNSW-CEEM/Solar-Curtailment.git /tmp/solar-curtailment
          python - <<'PY'
          from docx import Document
          d=Document('/tmp/solar-curtailment/documentations/dataset information.docx')
          print('DOC_TEXT_BEGIN')
          for para in d.paragraphs:
              if para.text.strip():
                  print(para.text.strip())
          for ti, table in enumerate(d.tables):
              print(f'TABLE {ti}')
              for row in table.rows:
                  print(' | '.join(c.text.replace('\n',' / ') for c in row.cells))
          print('DOC_TEXT_END')
          PY
      - name: Check public Google Drive folder
        continue-on-error: true
        run: |
          mkdir -p /tmp/canvas-data
          gdown --folder 'https://drive.google.com/drive/folders/1pQ3h7HCYYzm1rxQpw1sw4qD8-uZYcZ5R?usp=sharing' -O /tmp/canvas-data
      - name: Report downloaded files
        run: |
          find /tmp/canvas-data -type f -printf '%P %s bytes\n' || true
