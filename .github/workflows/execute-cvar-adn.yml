name: Execute Xia 2025 CVaR ADN notebook

on:
  push:
    paths:
      - ".github/workflows/execute-cvar-adn.yml"
      - "papers/2025-ijepes-cvar-adn/cvar_adn_reproduction.ipynb"
      - "papers/2025-ijepes-cvar-adn/scenario_setup.py"
      - "papers/2025-ijepes-cvar-adn/dispatch_cvar.py"
      - "papers/2025-ijepes-cvar-adn/requirements.txt"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: papers/2025-ijepes-cvar-adn/requirements.txt

      - name: Install dependencies
        run: pip install -r papers/2025-ijepes-cvar-adn/requirements.txt

      - name: Execute notebook
        working-directory: papers/2025-ijepes-cvar-adn
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute cvar_adn_reproduction.ipynb \
            --inplace \
            --ExecutePreprocessor.timeout=1500 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/2025-ijepes-cvar-adn/cvar_adn_reproduction.ipynb
          if git diff --cached --quiet; then
            echo "Notebook already contains current outputs."
            exit 0
          fi
          git commit -m "Execute Xia 2025 CVaR ADN pandapower notebook [skip ci]"
          git push
