name: Materialize SPS-UK dataset archive

on:
  push:
    paths:
      - ".github/workflows/materialize-sps-uk-dataset.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download byte-identical SPS-UK source CSVs
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/SPS-UK dataset"
          base="https://raw.githubusercontent.com/AyrtonB/WPD-DS-Challenge/main/data/raw"
          curl -L --fail --retry 3 "$base/demand_train_set4.csv" -o "$work/SPS-UK dataset/demand_train_set4.csv"
          curl -L --fail --retry 3 "$base/pv_train_set4.csv" -o "$work/SPS-UK dataset/pv_train_set4.csv"
          curl -L --fail --retry 3 "$base/weather_train_set4.csv" -o "$work/SPS-UK dataset/weather_train_set4.csv"

          test "$(git hash-object "$work/SPS-UK dataset/demand_train_set4.csv")" = "ac2f7b9c75a97d5af5f0f0553a00ebf0db406191"
          test "$(git hash-object "$work/SPS-UK dataset/pv_train_set4.csv")" = "d0df197cedb00814c4ff7b94e13b711046f0c6c3"
          test "$(git hash-object "$work/SPS-UK dataset/weather_train_set4.csv")" = "52c7d97d109e240e309fc6c2a1a6ddcc93001947"

          out="papers/2024-smartgridcomm-conformal-mlpf/data/SPS-UK_dataset.zip"
          mkdir -p "$(dirname "$out")"
          (
            cd "$work"
            zip -9 -X -r "$GITHUB_WORKSPACE/$out" "SPS-UK dataset"
          )
          ls -lh "$out"

      - name: Commit binary dataset archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/2024-smartgridcomm-conformal-mlpf/data/SPS-UK_dataset.zip
          if git diff --cached --quiet; then
            echo "Archive already up to date."
            exit 0
          fi
          git commit -m "Add SPS-UK dataset archive"
          git push
