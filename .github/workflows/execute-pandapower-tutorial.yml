name: Execute pandapower tutorial notebook

on:
  push:
    paths:
      - ".github/workflows/execute-pandapower-tutorial.yml"
      - "tutorials/pandapower_power_flow_intro.ipynb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install "pandapower>=3.5,<4" "pandas>=2.2" "matplotlib>=3.8" "jupyterlab>=4.0" "nbconvert>=7.16"

      - name: Execute notebook
        working-directory: tutorials
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute pandapower_power_flow_intro.ipynb \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/pandapower_power_flow_intro.ipynb
          if git diff --cached --quiet; then
            echo "Notebook already contains current outputs."
            exit 0
          fi
          git commit -m "Execute pandapower tutorial notebook [skip ci]"
          git push
